general:
  stop_time: 10m
  model_unblocked_syscall_latency: true

network:
  graph:
    type: gml
    inline: |
      graph [
        directed 0
        node [
          id 0
          label "Control Room"
          host_bandwidth_down "1 Gbit"
          host_bandwidth_up "1 Gbit"
        ]
        node [
          id 1
          label "Factory Floor A"
          host_bandwidth_down "100 Mbit"
          host_bandwidth_up "100 Mbit"
        ]
        node [
          id 2
          label "Factory Floor B"
          host_bandwidth_down "100 Mbit"
          host_bandwidth_up "100 Mbit"
        ]
        node [
          id 3
          label "Warehouse"
          host_bandwidth_down "50 Mbit"
          host_bandwidth_up "50 Mbit"
        ]
        node [
          id 4
          label "Outdoor Sensors"
          host_bandwidth_down "10 Mbit"
          host_bandwidth_up "1 Mbit"
        ]
        edge [
          source 0
          target 0
          latency "1 ms"
          packet_loss 0.0
        ]
        edge [
          source 1
          target 1
          latency "1 ms"
          packet_loss 0.0
        ]
        edge [
          source 2
          target 2
          latency "1 ms"
          packet_loss 0.0
        ]
        edge [
          source 3
          target 3
          latency "1 ms"
          packet_loss 0.0
        ]
        edge [
          source 4
          target 4
          latency "1 ms"
          packet_loss 0.0
        ]
        edge [
          source 0
          target 1
          latency "2 ms"
          packet_loss 0.001
        ]
        edge [
          source 0
          target 2
          latency "2 ms"
          packet_loss 0.001
        ]
        edge [
          source 0
          target 3
          latency "10 ms"
          packet_loss 0.005
        ]
        edge [
          source 0
          target 4
          latency "25 ms"
          packet_loss 0.03
        ]
      ]

hosts:
  server:
    network_node_id: 0
    processes:
    - path: tgen
      args: ../../../tgen.server.graphml.xml
      start_time: 1s
      expected_final_state: running

  # Clients 1-30: Factory Floor A (Node 1)
