[package]
name    = "raft"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
prost       = "0.14.3"
tokio       = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tonic       = "0.14.6"

[target.'cfg(not(target_os = "espidf"))'.dependencies]
redb  = "4.1.0"
tonic = "0.14.6"

[build-dependencies]
tonic-build = "0.10"