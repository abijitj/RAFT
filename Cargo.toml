[package]
name = "raft"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1" 
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tonic = "0.14.6"
prost = "0.14.3"
hydroflow = "0.10.0"

[target.'cfg(not(target_os = "espidf"))'.dependencies]
tonic = "0.14.6"
redb = "4.1.0"

[build-dependencies]
tonic-build = { version = "0.11", features = ["rustfmt"] }