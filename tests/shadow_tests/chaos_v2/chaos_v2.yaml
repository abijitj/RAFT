hosts:
  node1:
    network_node_id: 0
    ip_addr: 11.0.0.1
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "1 /workspaces/RAFT/tests/shadow_tests/chaos/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node2:
    network_node_id: 1
    ip_addr: 11.0.0.2
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "2 /workspaces/RAFT/tests/shadow_tests/chaos/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node3:
    network_node_id: 2
    ip_addr: 11.0.0.3
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/chaos/cluster.json --write-at-second 50 --write-value true"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node4:
    network_node_id: 3
    ip_addr: 11.0.0.4
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "4 /workspaces/RAFT/tests/shadow_tests/chaos/cluster.json"
        start_time: 1s
        shutdown_time: 25s
        shutdown_signal: SIGKILL
        expected_final_state: {signaled: SIGKILL}
        environment:
          RUST_LOG: info

  node5:
    network_node_id: 4
    ip_addr: 11.0.0.5
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "5 /workspaces/RAFT/tests/shadow_tests/chaos/cluster.json --write-at-second 70 --write-value false"
        start_time: 1s
        shutdown_time: 40s
        shutdown_signal: SIGKILL
        expected_final_state: {signaled: SIGKILL}
        environment:
          RUST_LOG: info

  node6:
    network_node_id: 5
    ip_addr: 11.0.0.6
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "6 /workspaces/RAFT/tests/shadow_tests/chaos/cluster.json --write-at-second 30 --write-value false"
        start_time: 1s
        shutdown_time: 60s
        shutdown_signal: SIGKILL
        expected_final_state: {signaled: SIGKILL}
        environment:
          RUST_LOG: debug 

  node7:
    network_node_id: 6
    ip_addr: 11.0.0.7
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "7 /workspaces/RAFT/tests/shadow_tests/chaos/cluster.json  --write-at-second 10 --write-value true"
        start_time: 1s
        shutdown_time: 20s
        shutdown_signal: SIGKILL
        expected_final_state: {signaled: SIGKILL}
        environment:
          RUST_LOG: debug 