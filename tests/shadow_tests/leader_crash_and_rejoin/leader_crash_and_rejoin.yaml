general:
  stop_time: 10s
  bootstrap_end_time: 500ms
  model_unblocked_syscall_latency: true

# t = 1s nodes 1-5 startup 
# t = 2s node 3 (the leader) crashes 
# t = 3s write at node 2 (new leader) should pass
# t = 4s node 3 rejoins 
# write should propogate to all nodes

network:
  graph:
    type: 1_gbit_switch
    bandwidth_down: 1 Gbit
    bandwidth_up: 1 Gbit
    latency: 10 ms

hosts:
  node1:
    network_node_id: 0
    ip_addr: 11.0.0.1
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "1 /workspaces/RAFT/tests/shadow_tests/leader_partitioned/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node2:
    network_node_id: 0
    ip_addr: 11.0.0.2
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "2 /workspaces/RAFT/tests/shadow_tests/leader_partitioned/cluster.json --write-at-ms 2000 --write-value true"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: debug 

  node3:
    network_node_id: 0
    ip_addr: 11.0.0.3
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/leader_partitioned/cluster.json"
        start_time: 1s
        shutdown_time: 2s
        shutdown_signal: SIGKILL
        expected_final_state:
          signaled: SIGKILL
        environment:
          RUST_LOG: info
        
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/leader_partitioned/cluster.json"
        start_time: 4s
        expected_final_state: running
        environment:
          RUST_LOG: debug 


  node4:
    network_node_id: 0
    ip_addr: 11.0.0.4
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "4 /workspaces/RAFT/tests/shadow_tests/leader_partitioned/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node5:
    network_node_id: 0
    ip_addr: 11.0.0.5
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "5 /workspaces/RAFT/tests/shadow_tests/leader_partitioned/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info