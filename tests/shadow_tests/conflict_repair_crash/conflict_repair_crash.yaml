general:
  stop_time: 12s
  bootstrap_end_time: 500ms
  model_unblocked_syscall_latency: true

# Node 3 appends `true` while isolated. Nodes 1 and 2 elect a new leader and
# append `false` at the same index. When connectivity returns, node 3 exits
# immediately after persisting suffix truncation but before appending the
# replacement entry. Its restarted process must recover the prefix and finish
# catching up from the leader.

network:
  graph:
    type: 1_gbit_switch
    bandwidth_down: 1 Gbit
    bandwidth_up: 1 Gbit
    latency: 10 ms

hosts:
  node1:
    network_node_id: 0
    ip_addr: 11.0.0.1
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "1 /workspaces/RAFT/tests/shadow_tests/conflict_repair_crash/cluster.json --block 3 --from 1500 --to 5000 --write-at-ms 3000 --write-value false"
        start_time: 1s
        expected_final_state: running
        environment: {RUST_LOG: info, RAFT_COMPACTION_THRESHOLD: "1000"}

  node2:
    network_node_id: 0
    ip_addr: 11.0.0.2
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "2 /workspaces/RAFT/tests/shadow_tests/conflict_repair_crash/cluster.json --block 3 --from 1500 --to 5000 --write-at-ms 3000 --write-value false"
        start_time: 1s
        expected_final_state: running
        environment: {RUST_LOG: info, RAFT_COMPACTION_THRESHOLD: "1000"}

  node3:
    network_node_id: 0
    ip_addr: 11.0.0.3
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/conflict_repair_crash/cluster.json --block 1 --from 1500 --to 5000 --block 2 --from 1500 --to 5000 --write-at-ms 2000 --write-value true"
        start_time: 1s
        expected_final_state: {exited: 86}
        environment:
          RUST_LOG: info
          RAFT_COMPACTION_THRESHOLD: "1000"
          RAFT_EXIT_AFTER_CONFLICT_TRUNCATION: "1"
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/conflict_repair_crash/cluster.json"
        start_time: 8s
        expected_final_state: running
        environment: {RUST_LOG: info, RAFT_COMPACTION_THRESHOLD: "1000"}
