general:
  stop_time: 30s
  bootstrap_end_time: 2s
  model_unblocked_syscall_latency: true

# 6 nodes split evenly: 3 on network 0, 3 on network 1. Neither half is a
# majority (need 4/6). Neither side should be able to elect a leader or commit
# anything. This tests that the system correctly stalls rather than allowing
# split-brain commits. The invariant checker verifies no entries appear on only
# one side with majority replication (which would be impossible here anyway).

network:
  graph:
    type: 1_gbit_switch
    latency: 10ms

hosts:
  node1:
    network_node_id: 0
    ip_addr: 11.0.0.1
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "1 /workspaces/RAFT/tests/shadow_tests/even_split/cluster.json --write-at-second 10 --write-value true"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node2:
    network_node_id: 0
    ip_addr: 11.0.0.2
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "2 /workspaces/RAFT/tests/shadow_tests/even_split/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node3:
    network_node_id: 0
    ip_addr: 11.0.0.3
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/even_split/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node4:
    network_node_id: 1
    ip_addr: 11.0.0.4
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "4 /workspaces/RAFT/tests/shadow_tests/even_split/cluster.json --write-at-second 10 --write-value false"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node5:
    network_node_id: 1
    ip_addr: 11.0.0.5
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "5 /workspaces/RAFT/tests/shadow_tests/even_split/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node6:
    network_node_id: 1
    ip_addr: 11.0.0.6
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "6 /workspaces/RAFT/tests/shadow_tests/even_split/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info