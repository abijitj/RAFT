general:
  stop_time: 60s
  bootstrap_end_time: 2s
  model_unblocked_syscall_latency: true

network:
  graph:
    type: 1_gbit_switch
    latency: 10ms

hosts:
  node1:
    network_node_id: 0
    ip_addr: 11.0.0.1
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "1 /workspaces/RAFT/tests/shadow_tests/node_churn/cluster.json --write-at-second 10 --write-value true"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node2:
    network_node_id: 0
    ip_addr: 11.0.0.2
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "2 /workspaces/RAFT/tests/shadow_tests/node_churn/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node3:
    network_node_id: 0
    ip_addr: 11.0.0.3
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/node_churn/cluster.json"
        start_time: 1s
        shutdown_time: 5s
        shutdown_signal: SIGKILL
        expected_final_state: {signaled: SIGKILL}
        environment:
          RUST_LOG: info

  node4:
    network_node_id: 0
    ip_addr: 11.0.0.4
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "4 /workspaces/RAFT/tests/shadow_tests/node_churn/cluster.json"
        start_time: 1s
        shutdown_time: 10s
        shutdown_signal: SIGKILL
        expected_final_state: {signaled: SIGKILL}
        environment:
          RUST_LOG: info

  node5:
    network_node_id: 0
    ip_addr: 11.0.0.5
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "5 /workspaces/RAFT/tests/shadow_tests/node_churn/cluster.json"
        start_time: 1s
        shutdown_time: 15s
        shutdown_signal: SIGKILL
        expected_final_state: {signaled: SIGKILL}
        environment:
          RUST_LOG: info