general:
  stop_time: 7s
  bootstrap_end_time: 500ms

network:
  graph:
    type: 1_gbit_switch
    bandwidth_down: 1 Gbit
    bandwidth_up: 1 Gbit
    latency: 10 ms

hosts:
  node1:
    network_node_id: 0
    ip_addr: 11.0.0.1
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "1 /workspaces/RAFT/tests/shadow_tests/leader_replication/cluster.json" 
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: debug 

  node2:
    network_node_id: 0
    ip_addr: 11.0.0.2
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "2 /workspaces/RAFT/tests/shadow_tests/leader_replication/cluster.json --block 3 --from 2002 --to 2500" 
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: debug

  node3:
    network_node_id: 0
    ip_addr: 11.0.0.3
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/leader_replication/cluster.json --write-at-ms 2000 --write-value false" 
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: debug