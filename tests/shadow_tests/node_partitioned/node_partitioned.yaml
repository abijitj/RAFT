general:
  stop_time: 30s
  bootstrap_end_time: 2s
  model_unblocked_syscall_latency: true

# t = 1 nodes 1-5 startup
# t = 2 node 1 gets partitioned away from the other nodes 
# t = 10 write happens at node 3 (the leader)

network:
  graph:
    type: gml
    inline: |
      graph [
        directed 0
        node [
          id 0
          host_bandwidth_down "1 Gbit"
          host_bandwidth_up "1 Gbit"
        ]
        node [
          id 1
          host_bandwidth_down "1 Gbit"
          host_bandwidth_up "1 Gbit"
        ]
        edge [
          source 0
          target 0
          latency "10 ms"
        ]
        edge [
          source 1
          target 1
          latency "10 ms"
        ]
        edge [
          source 0
          target 1
          latency "10 ms"
          packet_loss 1.0
        ]
      ]

hosts:
  node1:
    network_node_id: 1
    ip_addr: 11.0.0.1
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "1 /workspaces/RAFT/tests/shadow_tests/leader_partitioned/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node2:
    network_node_id: 0
    ip_addr: 11.0.0.2
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "2 /workspaces/RAFT/tests/shadow_tests/leader_partitioned/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node3:
    network_node_id: 0
    ip_addr: 11.0.0.3
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/leader_partitioned/cluster.json --write-at-ms 10000 --write-value true"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node4:
    network_node_id: 0
    ip_addr: 11.0.0.4
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "4 /workspaces/RAFT/tests/shadow_tests/leader_partitioned/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node5:
    network_node_id: 0
    ip_addr: 11.0.0.5
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "5 /workspaces/RAFT/tests/shadow_tests/leader_partitioned/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info