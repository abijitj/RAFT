general:
  stop_time: 10m
  bootstrap_end_time: 5s
  model_unblocked_syscall_latency: true

network:
  graph:
    type: gml
    inline: |
      graph [
        directed 0
        node [
          id 0
          label "Control Room"
          host_bandwidth_down "1 Gbit"
          host_bandwidth_up "1 Gbit"
        ]
        node [
          id 1
          label "Factory Floor A"
          host_bandwidth_down "100 Mbit"
          host_bandwidth_up "100 Mbit"
        ]
        node [
          id 2
          label "Factory Floor B"
          host_bandwidth_down "100 Mbit"
          host_bandwidth_up "100 Mbit"
        ]
        node [
          id 3
          label "Warehouse"
          host_bandwidth_down "50 Mbit"
          host_bandwidth_up "50 Mbit"
        ]
        node [
          id 4
          label "Outdoor Sensors"
          host_bandwidth_down "10 Mbit"
          host_bandwidth_up "1 Mbit"
        ]
        edge [
          source 0
          target 0
          latency "1 ms"
          jitter "0 ms"
          packet_loss 0.0
        ]
        edge [
          source 1
          target 1
          latency "1 ms"
          jitter "0 ms"
          packet_loss 0.0
        ]
        edge [
          source 2
          target 2
          latency "1 ms"
          jitter "0 ms"
          packet_loss 0.0
        ]
        edge [
          source 3
          target 3
          latency "1 ms"
          jitter "0 ms"
          packet_loss 0.0
        ]
        edge [
          source 4
          target 4
          latency "1 ms"
          jitter "0 ms"
          packet_loss 0.0
        ]
        edge [
          source 0
          target 1
          latency "2 ms"
          jitter "1 ms"
          packet_loss 0.001
        ]
        edge [
          source 0
          target 2
          latency "2 ms"
          jitter "1 ms"
          packet_loss 0.001
        ]
        edge [
          source 0
          target 3
          latency "10 ms"
          jitter "2 ms"
          packet_loss 0.005
        ]
        edge [
          source 0
          target 4
          latency "25 ms"
          jitter "5 ms"
          packet_loss 0.03
        ]
      ]

