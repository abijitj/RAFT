general:
  stop_time: 10s
  bootstrap_end_time: 1s

network:
  graph:
    type: gml
    inline: |
      graph [
        directed 0
        node [
          id 0
          host_bandwidth_down "1 Gbit"
          host_bandwidth_up "1 Gbit"
        ]
        node [
          id 1
          host_bandwidth_down "1 Gbit"
          host_bandwidth_up "1 Gbit"
        ]
        node [
          id 2
          host_bandwidth_down "1 Gbit"
          host_bandwidth_up "1 Gbit"
        ]
        edge [ 
          source 0 
          target 0 
          latency "1 ms" 
        ]
        edge [ 
          source 1 
          target 1 
          latency "1 ms" 
        ]
        edge [ 
          source 2 
          target 2 
          latency "1 ms" 
        ]
        
        edge [ 
          source 0 
          target 1 
          latency "5 ms"
        ]
        edge [ 
          source 0 
          target 2 
          latency "5 ms"
        ]
        edge [ 
          source 1 
          target 2 
          latency "5 ms"
        ]
      ]

hosts:
  node1:
    network_node_id: 0
    ip_addr: 11.0.0.1
    processes:
      - path: /workspaces/RAFT/target/release/raft
        # Just pass the ID and the path to the shared config
        args: "1 /workspaces/RAFT/tests/shadow_tests/three_happy_nodes/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: debug

  node2:
    network_node_id: 1
    ip_addr: 11.0.0.2
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "2 /workspaces/RAFT/tests/shadow_tests/three_happy_nodes/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: debug

  node3:
    network_node_id: 2
    ip_addr: 11.0.0.3
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/three_happy_nodes/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: debug