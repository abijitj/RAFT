general:
  stop_time: 14s
  bootstrap_end_time: 500ms
  model_unblocked_syscall_latency: true

# A `true` entry is committed before the initial leader is killed. Additional
# crashes temporarily remove a majority and force repeated election terms.
# Once a majority returns, a later leader appends `false`. Every restarted node
# must retain the original committed entry and converge on the same final log.

network:
  graph:
    type: 1_gbit_switch
    bandwidth_down: 1 Gbit
    bandwidth_up: 1 Gbit
    latency: 10 ms

hosts:
  node1:
    network_node_id: 0
    ip_addr: 11.0.0.1
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "1 /workspaces/RAFT/tests/shadow_tests/leader_completeness_multi_term/cluster.json --write-at-ms 1500 --write-value true --write-at-ms 3500 --write-value false"
        start_time: 1s
        shutdown_time: 5s
        shutdown_signal: SIGKILL
        expected_final_state: {signaled: SIGKILL}
        environment: {RUST_LOG: info, RAFT_COMPACTION_THRESHOLD: "1000"}
      - path: /workspaces/RAFT/target/release/raft
        args: "1 /workspaces/RAFT/tests/shadow_tests/leader_completeness_multi_term/cluster.json --write-at-ms 2500 --write-value false"
        start_time: 9s
        expected_final_state: running
        environment: {RUST_LOG: info, RAFT_COMPACTION_THRESHOLD: "1000"}

  node2:
    network_node_id: 0
    ip_addr: 11.0.0.2
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "2 /workspaces/RAFT/tests/shadow_tests/leader_completeness_multi_term/cluster.json --write-at-ms 1500 --write-value true --write-at-ms 3500 --write-value false"
        start_time: 1s
        shutdown_time: 6s
        shutdown_signal: SIGKILL
        expected_final_state: {signaled: SIGKILL}
        environment: {RUST_LOG: info, RAFT_COMPACTION_THRESHOLD: "1000"}
      - path: /workspaces/RAFT/target/release/raft
        args: "2 /workspaces/RAFT/tests/shadow_tests/leader_completeness_multi_term/cluster.json --write-at-ms 2000 --write-value false"
        start_time: 9s
        expected_final_state: running
        environment: {RUST_LOG: info, RAFT_COMPACTION_THRESHOLD: "1000"}

  node3:
    network_node_id: 0
    ip_addr: 11.0.0.3
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/leader_completeness_multi_term/cluster.json --write-at-ms 1500 --write-value true"
        start_time: 1s
        shutdown_time: 3s
        shutdown_signal: SIGKILL
        expected_final_state: {signaled: SIGKILL}
        environment: {RUST_LOG: info, RAFT_COMPACTION_THRESHOLD: "1000"}
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/leader_completeness_multi_term/cluster.json --write-at-ms 1500 --write-value false"
        start_time: 7s
        expected_final_state: running
        environment: {RUST_LOG: info, RAFT_COMPACTION_THRESHOLD: "1000"}

  node4:
    network_node_id: 0
    ip_addr: 11.0.0.4
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "4 /workspaces/RAFT/tests/shadow_tests/leader_completeness_multi_term/cluster.json --write-at-ms 1500 --write-value true --write-at-ms 3500 --write-value false --write-at-ms 7500 --write-value false"
        start_time: 1s
        expected_final_state: running
        environment: {RUST_LOG: info, RAFT_COMPACTION_THRESHOLD: "1000"}

  node5:
    network_node_id: 0
    ip_addr: 11.0.0.5
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "5 /workspaces/RAFT/tests/shadow_tests/leader_completeness_multi_term/cluster.json --write-at-ms 1500 --write-value true --write-at-ms 3500 --write-value false --write-at-ms 7500 --write-value false"
        start_time: 1s
        expected_final_state: running
        environment: {RUST_LOG: info, RAFT_COMPACTION_THRESHOLD: "1000"}
