general:
  stop_time: 60s
  bootstrap_end_time: 2s
  model_unblocked_syscall_latency: true

network:
  graph:
    type: gml
    inline: |
      graph [
        directed 0
        node [
          id 0
          host_bandwidth_down "1 Gbit"
          host_bandwidth_up "1 Gbit"
        ]
        edge [
          source 0
          target 0
          latency "10 ms"
        ]
      ]

# node1 wins the election quickly (lowest ID, fastest timeout in our seeded RNG),
# then gets killed at 5s before it can commit the write injected at 4s.
# The remaining 4 nodes must elect a new leader and either:
#   - commit the entry if it was replicated to a majority before the crash, or
#   - discard it if it wasn't.
# Either way, the five invariants must hold.

hosts:
  node1:
    network_node_id: 0
    ip_addr: 11.0.0.1
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "1 /workspaces/RAFT/tests/shadow_tests/leader_crash_before_commit/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node2:
    network_node_id: 0
    ip_addr: 11.0.0.2
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "2 /workspaces/RAFT/tests/shadow_tests/leader_crash_before_commit/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node3:
    network_node_id: 0
    ip_addr: 11.0.0.3
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "3 /workspaces/RAFT/tests/shadow_tests/leader_crash_before_commit/cluster.json --write-at-second 3 --write-value true"
        start_time: 1s
        shutdown_time: 5s
        shutdown_signal: SIGKILL
        expected_final_state: {signaled: SIGKILL}
        environment:
          RUST_LOG: info

  node4:
    network_node_id: 0
    ip_addr: 11.0.0.4
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "4 /workspaces/RAFT/tests/shadow_tests/leader_crash_before_commit/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info

  node5:
    network_node_id: 0
    ip_addr: 11.0.0.5
    processes:
      - path: /workspaces/RAFT/target/release/raft
        args: "5 /workspaces/RAFT/tests/shadow_tests/leader_crash_before_commit/cluster.json"
        start_time: 1s
        expected_final_state: running
        environment:
          RUST_LOG: info
